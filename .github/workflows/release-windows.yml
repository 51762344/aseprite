name: Release Windows Aseprite

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 1. 拉取 Aseprite 源码与所有子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 下载官方预编译的 Skia 引擎 (m124)
        shell: bash
        run: |
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
          unzip -q skia.zip -d skia

      - name: 3. 安装官方指定的 Ninja 构建工具
        uses: aseprite/get-ninja@main

      - name: 4. 配置 Windows C++ 编译环境 (MSVC x64)
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: 5. 生成编译配置并开始编译 Aseprite
        shell: bash
        run: |
          mkdir build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="${GITHUB_WORKSPACE}/skia" \
            -DSKIA_LIBRARY_DIR="${GITHUB_WORKSPACE}/skia/out/Release-x64" \
            -DSKIA_LIBRARY="${GITHUB_WORKSPACE}/skia/out/Release-x64/skia.lib" \
            -DUSE_SHARED_CURL=OFF \
            -DUSE_SHARED_ZLIB=OFF \
            -DENABLE_TESTS=OFF \
            -G Ninja ..
          ninja aseprite

      - name: 6. 补齐运行所需的 DLL 并清理垃圾缓存
        shell: bash
        run: |
          # 把云端环境里的 OpenSSL 等依赖 DLL 自动拷贝到 bin 目录中
          cp /c/Program\ Files/OpenSSL-Win64/bin/*.dll build/bin/ 2>/dev/null || true
          cp /mingw64/bin/libcrypto-3-x64.dll build/bin/ 2>/dev/null || true
          cp /mingw64/bin/libssl-3-x64.dll build/bin/ 2>/dev/null || true
          # 删掉不需要的静态库缓存
          rm -rf build/bin/*.lib build/bin/*.exp build/bin/*.pdb

      - name: 7. 打包整个 bin 目录 (含 exe、所有 dll 和 data)
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64-Portable
          path: |
            build/bin/*.exe
            build/bin/*.dll
            build/bin/data/
          if-no-files-found: error